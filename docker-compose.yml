services:
    app:
        image: node:22-alpine
        working_dir: /repo
        environment:
            APP: app
        entrypoint: sh /repo/docker/node/entrypoint.sh
        volumes:
            - .:/repo
            - node_modules:/repo/node_modules
        ports:
            - "5173:5173"

    admin:
        image: node:22-alpine
        working_dir: /repo
        environment:
            APP: admin
        entrypoint: sh /repo/docker/node/entrypoint.sh
        volumes:
            - .:/repo
            - node_modules:/repo/node_modules
        ports:
            - "5174:5174"

volumes:
    node_modules:
